name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tokens deterministic and committed
        run: |
          pnpm build:tokens
          git diff --exit-code -- tokens app/assets/css/tokens.css

      - name: Manifest schema check
        run: pnpm manifest:check

      - name: llms.txt generated from manifest and committed
        run: |
          pnpm build:llms
          git diff --exit-code -- llms.txt

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Stylelint)
        run: pnpm lint:style

      - name: Lint fixture gate (violations must fail, clean must pass)
        run: pnpm test:lint

      - name: Component tests
        run: pnpm test

      - name: Build playground
        run: pnpm build

      # PRO-233 regression fixtures: the validation-spike consuming apps.
      - name: Build spike app (fresh consuming app)
        run: pnpm build:spike

      - name: Install docus-coexist (own lockfile — docus is not a layer dep)
        run: pnpm --dir spikes/docus-coexist install --frozen-lockfile

      - name: Build docus-coexist (layer + docus, Social House configuration)
        run: pnpm --dir spikes/docus-coexist build
        env:
          # The docus + layer Nitro build exceeds the runner's default ~2 GB
          # node heap (OOM, exit 134); it needs no more than a plain-sized
          # heap bump. Verified green locally with default heap on 32 GB.
          NODE_OPTIONS: --max-old-space-size=4096
