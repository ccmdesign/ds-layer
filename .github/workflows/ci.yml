name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tokens deterministic and committed
        run: |
          pnpm build:tokens
          git diff --exit-code -- tokens app/assets/css/tokens.css

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Stylelint)
        run: pnpm lint:style

      - name: Component tests
        run: pnpm test

      - name: Build playground
        run: pnpm build
